<!DOCTYPE html>

<html lang="en">

<head>
    <script src="../public/js/github-pages-adapter.js"></script>
    <!-- Offline / Local File & Server Path Compatibility Adapter -->
    <script>
        (function() {
            if (window.location.protocol === "file:") {
                var pathname = window.location.pathname.replace(/\\/g, "/");
                var inViews = pathname.toLowerCase().includes("/views/");
                var publicPrefix = inViews ? "../public/" : "public/";
                var viewsPrefix = inViews ? "./" : "views/";

                ["style.css"].forEach(function(c) {
                    var link = document.createElement("link");
                    link.rel = "stylesheet";
                    link.href = publicPrefix + "css/" + c;
                    document.head.appendChild(link);
                });

                function fixAssets() {
                    document.querySelectorAll("img").forEach(function(img) {
                        var src = img.getAttribute("src") || "";
                        if (src.startsWith("/images/") || src.startsWith("./images/") || src.startsWith("images/")) {
                            var filename = src.split("/").pop();
                            img.src = publicPrefix + "images/" + filename;
                        }
                    });
                    document.querySelectorAll("a[href]").forEach(function(a) {
                        var href = a.getAttribute("href") || "";
                        if (href.startsWith("/") && !href.startsWith("//")) {
                            if (href === "/") {
                                a.href = inViews ? "./index.html" : "./index.html";
                            } else if (href.includes(".html")) {
                                var clean = href.replace(/^\//, "");
                                a.href = inViews ? ("./" + clean) : (viewsPrefix + clean);
                            }
                        }
                    });
                }
                if (document.readyState === "loading") {
                    document.addEventListener("DOMContentLoaded", fixAssets);
                } else {
                    fixAssets();
                }
            }
        })();
    </script>


    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Register - MyStore</title>

    <!-- Google Fonts -->
        <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400&family=Playfair+Display:ital,wght@0,400;0,600;0,700;0,800;0,900;1,400;1,700&display=swap" rel="stylesheet">

    <!-- Font Awesome 6 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../public/css/style.css">
    <link rel="stylesheet" href="../public/css/register.css">
    <link rel="stylesheet" href="/css/register.css">

</head>

<body>


    <div class="auth-container">


        <div class="auth-box">

            <div class="auth-logo">

                My<span>Store</span>

            </div>


            <h1>
                Create Account
            </h1>


            <p class="subtitle">
                Create your MyStore account
            </p>


            <form id="registerForm">


                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    placeholder="Enter your name"
                    required
                >


                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    placeholder="Enter your email"
                    required
                >


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="password"
                    placeholder="Enter password"
                    required
                >


                <button
                    type="submit"
                >
                    <i class="fa-solid fa-user-plus"></i> Create Account
                </button>


            </form>


            <p id="registerMessage"></p>


            <p class="account-link">

                Already have an account?

                <a href="./login.html">
                    Login
                </a>

            </p>


        </div>

    </div>


    <script src="../public/js/register.js?v=10"></script>

</body>

</html>
